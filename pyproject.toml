[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibekampff"
version = "0.1.0"
description = "A Voight-Kampff-style introspection test read out of a language model's j-space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.5",
    "huggingface_hub",
    "numpy",
    "jlens @ git+https://github.com/anthropics/jacobian-lens.git",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["vibekampff"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Spike code is throwaway by design and exempt from the project's standards
# (see CLAUDE.md), so `ruff check .` stays meaningful for real code.
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
